[package]
name = "pqvpnd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
pqvpn_core = { path = "../pqvpn_core" }
pqvpn_fd = { path = "../pqvpn_fd" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.1.2", default-features = false, features = ["std", "parse", "serde"] }
nix = { version = "=0.31.3", features = ["fs", "signal", "process", "poll"] }
serde_json = "=1.0.154"
zeroize = "=1.9.1"


[[test]]
# Re-executes itself under `unshare -rn` to bring a real TUN and routes up and down; skips without user namespaces.
name = "netns"
harness = false

[[test]]
# The real Python server against the pqvpnd binary, inside `unshare -rn` (tests/conformance.py).
name = "conformance"
harness = false
