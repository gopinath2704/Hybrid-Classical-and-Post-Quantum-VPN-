[package]
name = "pqvpn_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aws-lc-rs = "=1.18.2"
pyo3 = { version = "=0.30.1", features = ["abi3-py311"] }
zeroize = "=1.9.1"
arc-swap = "=1.9.3"

[dev-dependencies]
serde_json = "=1.0.154"
