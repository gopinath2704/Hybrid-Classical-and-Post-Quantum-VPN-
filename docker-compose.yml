services:
  vpn-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hybrid_vpn_server
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    ports:
      - "51820:51820"      # KEMTLS handshake TCP
      - "51820:51820/udp"  # AES-256-GCM VPN tunnel UDP
    volumes:
      - ./config/server.toml:/etc/pqvpn/server.toml:ro
      - ./config/server_identity_private.key:/etc/pqvpn/server_identity_private.key:ro
      - ./config/server_identity_public.key:/etc/pqvpn/server_identity_public.key:ro
      - ./config/authorized_clients.json:/etc/pqvpn/authorized_clients.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      vpn-net:
        ipv4_address: 10.100.0.2

  vpn-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hybrid_vpn_client
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    depends_on:
      - vpn-server
    profiles: ["development-client"]
    volumes:
      - ./config/client.toml:/etc/pqvpn/client.toml:ro
      - ./config/client_identity_private.key:/etc/pqvpn/client_identity_private.key:ro
      - ./config/server_identity_public.key:/etc/pqvpn/server_identity_public.key:ro
    command: ["python3", "-m", "vpn.cli", "client", "connect", "--config", "/etc/pqvpn/client.toml", "--server-host", "vpn-server"]
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      vpn-net:
        ipv4_address: 10.100.0.3

networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/24
